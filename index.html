<style>
:root{
  --kanvas:#E8E3D1;
  --kanvas-2:#F2EEE1;
  --tinta:#23301F;
  --tinta-2:#55604F;
  --cokelat:#4A3620;
  --cokelat-muda:#B08A4F;
  --api:#E09512;
  --rumput:#3B6B45;
  --garis:rgba(35,48,31,.18);
  --garis-kuat:rgba(35,48,31,.34);
  --kartu:#FBF8EE;
  --bayang:0 1px 0 rgba(35,48,31,.10);
  --radius:3px;
  --st:#9A5B00; --st-batal:#A32A1F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --kanvas:#151A13; --kanvas-2:#1B2118; --tinta:#E9E4D3; --tinta-2:#A9B1A2;
    --cokelat:#D9B98A; --cokelat-muda:#C9A063; --api:#F2AE3A; --rumput:#7FB183;
    --garis:rgba(233,228,211,.16); --garis-kuat:rgba(233,228,211,.32); --kartu:#20271D; --bayang:none;
    --_s:#7ED18C; --_p:#EF5350; --_e:#86B8E8; --st:#F2AE3A; --st-batal:#F08A72;
  }
}
:root[data-theme="dark"]{
  --kanvas:#151A13; --kanvas-2:#1B2118; --tinta:#E9E4D3; --tinta-2:#A9B1A2;
  --cokelat:#D9B98A; --cokelat-muda:#C9A063; --api:#F2AE3A; --rumput:#7FB183;
  --garis:rgba(233,228,211,.16); --garis-kuat:rgba(233,228,211,.32); --kartu:#20271D; --bayang:none;
  --_s:#7ED18C; --_p:#EF5350; --_e:#86B8E8; --st:#F2AE3A; --st-batal:#F08A72;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--kanvas);color:var(--tinta);
  font-family:Karla,"Segoe UI",system-ui,sans-serif;font-size:16px;line-height:1.6;
  overflow-x:hidden;
}
img{max-width:100%}
.bungkus{max-width:860px;margin:0 auto;padding:0 18px}
button:focus-visible,input:focus-visible,summary:focus-visible,a:focus-visible,label:focus-visible{
  outline:2px solid var(--api);outline-offset:2px;
}

/* ---------- bilah navigasi bawah ---------- */
.bilah-atas{
  position:sticky;bottom:0;z-index:30;background:var(--kanvas);border-top:1px solid var(--garis-kuat);box-shadow:0 -4px 14px rgba(0,0,0,.08)
}
.bilah-atas-isi{
  max-width:1320px;margin:0 auto;padding:11px 18px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;
}
.merek{display:none}
.merek svg{display:block}
.merek span{font:700 .82rem/1.1 "Zilla Slab",serif;color:var(--tinta)}
.titik-halaman{display:flex;gap:6px;align-items:center}
.titik-halaman i{
  width:7px;height:7px;border-radius:50%;background:var(--garis-kuat);display:block;font-style:normal;
}
.titik-halaman i.aktif{background:var(--api);width:18px;border-radius:4px;transition:width .25s ease,background .25s ease}
.navigasi-halaman{display:flex;align-items:center;justify-content:center;gap:6px;order:2;flex:1 1 100%;min-width:0;overflow:visible}
.daftar-halaman{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:nowrap;width:100%;min-width:0}
.tombol-halaman{border:1px solid var(--garis-kuat);background:var(--kartu);color:var(--tinta);border-radius:999px;height:30px;padding:0 9px;font:700 .68rem/1 Karla,sans-serif;white-space:nowrap;cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease}
.tombol-halaman:hover{border-color:var(--api)}
.tombol-halaman.aktif{background:var(--tinta);color:var(--kanvas);border-color:var(--tinta)}
.audio-kendali{position:fixed;top:8px;right:14px;z-index:40;display:flex;align-items:center;gap:6px;padding:4px;background:color-mix(in srgb,var(--kanvas) 88%,transparent);border:1px solid var(--garis);border-radius:999px;box-shadow:0 3px 12px rgba(0,0,0,.1)}
.audio-tombol{border:1px solid var(--garis-kuat);background:var(--kartu);color:var(--tinta);border-radius:999px;padding:6px 9px;font:700 .68rem/1 Karla,sans-serif;cursor:pointer;white-space:nowrap;transition:background .15s ease,color .15s ease,border-color .15s ease}
.audio-tombol[aria-pressed="true"]{background:var(--tinta);color:var(--kanvas);border-color:var(--tinta)}
.audio-tombol[aria-pressed="false"]{opacity:.72}
.audio-tombol:hover{border-color:var(--api)}

/* ---------- panggung flipbook ---------- */
.panggung{
  position:relative;overflow:hidden;
}
.lembar{position:relative}
.lembar-overlay{
  position:absolute;top:0;left:0;width:100%;
  background:var(--kanvas);
  backface-visibility:hidden;
  pointer-events:none;z-index:5;
  overflow:hidden;will-change:opacity,transform,filter;
  transition:opacity .38s cubic-bezier(.22,.61,.36,1),transform .38s cubic-bezier(.22,.61,.36,1),filter .38s ease;
  transform:translateY(0);opacity:1;filter:blur(0);
}
.lembar-overlay::before{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:2;opacity:0;
  background:radial-gradient(ellipse 74% 46% at 100% 100%,rgba(12,10,5,.52),rgba(12,10,5,.16) 33%,transparent 70%);
  mix-blend-mode:multiply;
}
.lembar-overlay::after{
  content:"";position:absolute;inset:0;pointer-events:none;z-index:3;
  background:linear-gradient(105deg,rgba(255,255,255,0) 20%,rgba(255,255,255,.26) 45%,rgba(255,255,255,0) 60%),linear-gradient(90deg,transparent 40%,rgba(16,12,5,.28) 100%);
  opacity:0;
}
.lembar-overlay.putar-maju{
  transform:translateY(-6px);opacity:0;filter:blur(1.2px);
}
.lembar-overlay.putar-mundur{
  transform:translateY(6px);opacity:0;filter:blur(1.2px);
}
.lembar-overlay.putar-maju::before,.lembar-overlay.putar-mundur::before{display:none}
.lembar-overlay.putar-maju::after,.lembar-overlay.putar-mundur::after{animation:none;opacity:0}
@keyframes putarMaju{
  0%{transform:rotateY(0) rotateZ(0) translate3d(0,0,0);filter:brightness(1);box-shadow:0 0 0 rgba(20,15,5,0)}
  18%{transform:rotateY(-9deg) rotateZ(1.2deg) translate3d(-.2%,.55%,7px);filter:brightness(.99);box-shadow:-12px 12px 24px rgba(20,15,5,.18)}
  53%{transform:rotateY(-88deg) rotateZ(2.7deg) translate3d(-1.5%,1.15%,15px);filter:brightness(.81);box-shadow:-56px 25px 66px rgba(20,15,5,.48)}
  100%{transform:rotateY(-176deg) rotateZ(0) translate3d(-.8%,0,0);filter:brightness(.64);box-shadow:0 0 0 rgba(20,15,5,0)}
}
@keyframes putarMundur{
  0%{transform:rotateY(0) rotateZ(0) translate3d(0,0,0);filter:brightness(1);box-shadow:0 0 0 rgba(20,15,5,0)}
  18%{transform:rotateY(9deg) rotateZ(-1.2deg) translate3d(.2%,.55%,7px);filter:brightness(.99);box-shadow:-12px 12px 24px rgba(20,15,5,.18)}
  53%{transform:rotateY(88deg) rotateZ(-2.7deg) translate3d(1.5%,1.15%,15px);filter:brightness(.81);box-shadow:-56px 25px 66px rgba(20,15,5,.48)}
  100%{transform:rotateY(176deg) rotateZ(0) translate3d(.8%,0,0);filter:brightness(.64);box-shadow:0 0 0 rgba(20,15,5,0)}
}
@keyframes bayangSudut{0%,8%{opacity:0}42%{opacity:.85}78%{opacity:.18}100%{opacity:0}}
@keyframes kilauLipat{0%,10%{opacity:0}35%{opacity:.92}68%{opacity:.32}100%{opacity:0}}
@keyframes kilauLipatMundur{0%,10%{opacity:0}35%{opacity:.72}68%{opacity:.24}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){
  .lembar-overlay.putar-maju,.lembar-overlay.putar-mundur,
  .lembar-overlay.putar-maju::after,.lembar-overlay.putar-mundur::after{animation:none!important;display:none}
}

.subkendali{background:var(--kanvas);border-bottom:1px solid var(--garis);padding:14px 0 12px}
.pilih-label{
  display:block;font:700 .74rem/1 Karla,sans-serif;letter-spacing:.03em;
  color:var(--tinta-2);margin-bottom:8px;text-transform:uppercase;
}
.gol-tombol{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.gtombol{
  font:700 .9rem/1.15 Karla,sans-serif;padding:13px 4px 11px;border-radius:var(--radius);
  border:2px solid var(--garis);border-top:4px solid var(--garis);
  background:var(--kartu);color:var(--tinta);cursor:pointer;text-align:center;
  transition:background .12s,color .12s,border-color .12s;
}
.gtombol:hover{border-color:var(--garis-kuat)}
.gtombol.gt-siaga{border-top-color:#3E8F4E}
.gtombol.gt-penggalang{border-top-color:#D62828}
.gtombol.gt-penegak{border-top-color:#F2C300}
.gtombol.gt-pandega{border-top-color:#5A3A24}
.gtombol[data-gol="semua"][aria-pressed="true"]{background:var(--tinta);border-color:var(--tinta);color:var(--kanvas)}
.gtombol.gt-siaga[aria-pressed="true"]{background:#3E8F4E;border-color:#3E8F4E;color:#fff}
.gtombol.gt-penggalang[aria-pressed="true"]{background:#D62828;border-color:#D62828;color:#fff}
.gtombol.gt-penegak[aria-pressed="true"]{background:#F2C300;border-color:#F2C300;color:#241b00}
.gtombol.gt-pandega[aria-pressed="true"]{background:#5A3A24;border-color:#5A3A24;color:#fff}
:root[data-theme="dark"] .gtombol.gt-siaga{border-top-color:var(--_s)}
:root[data-theme="dark"] .gtombol.gt-penggalang{border-top-color:var(--_p)}
:root[data-theme="dark"] .gtombol.gt-penegak{border-top-color:#FFD54F}
:root[data-theme="dark"] .gtombol.gt-pandega{border-top-color:#B9835E}
:root[data-theme="dark"] .gtombol.gt-siaga[aria-pressed="true"]{background:var(--_s);border-color:var(--_s);color:#12180F}
:root[data-theme="dark"] .gtombol.gt-penggalang[aria-pressed="true"]{background:var(--_p);border-color:var(--_p);color:#1A0E0A}
:root[data-theme="dark"] .gtombol.gt-penegak[aria-pressed="true"]{background:#FFD54F;border-color:#FFD54F;color:#211700}
:root[data-theme="dark"] .gtombol.gt-pandega[aria-pressed="true"]{background:#B9835E;border-color:#B9835E;color:#21140C}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .gtombol.gt-siaga{border-top-color:var(--_s)}
:root:not([data-theme="light"]) .gtombol.gt-penggalang{border-top-color:var(--_p)}
:root:not([data-theme="light"]) .gtombol.gt-penegak{border-top-color:#FFD54F}
:root:not([data-theme="light"]) .gtombol.gt-pandega{border-top-color:#B9835E}
:root:not([data-theme="light"]) .gtombol.gt-siaga[aria-pressed="true"]{background:var(--_s);border-color:var(--_s);color:#12180F}
:root:not([data-theme="light"]) .gtombol.gt-penggalang[aria-pressed="true"]{background:var(--_p);border-color:var(--_p);color:#1A0E0A}
:root:not([data-theme="light"]) .gtombol.gt-penegak[aria-pressed="true"]{background:#FFD54F;border-color:#FFD54F;color:#211700}
:root:not([data-theme="light"]) .gtombol.gt-pandega[aria-pressed="true"]{background:#B9835E;border-color:#B9835E;color:#21140C}}
.cari{
  margin-top:9px;width:100%;font:400 .88rem Karla,sans-serif;
  padding:9px 12px;border:1px solid var(--garis);border-radius:999px;background:var(--kartu);color:var(--tinta);
}
.cari::placeholder{color:var(--tinta-2)}

/* ---------- halaman sampul & penutup (penuh, gelap) ---------- */
.halgelap{min-height:calc(100vh - 49px);min-height:calc(100dvh - 49px);background:linear-gradient(180deg,rgba(21,31,22,.72) 0%,rgba(21,31,22,.84) 48%,rgba(21,31,22,.96) 100%),url("latar-pramuka-kemah.webp") center 42%/cover no-repeat;color:#EDE7D4;display:flex;flex-direction:column;position:relative;overflow:hidden}
.halgelap::before{content:"";position:absolute;inset:14px;border:1px solid rgba(237,231,212,.28);pointer-events:none}
.halgelap::after{content:"";position:absolute;inset:20px;border:1px solid rgba(237,231,212,.14);pointer-events:none}
.banner-kegiatan{width:100%;background:#07152f;line-height:0;position:relative;z-index:1;overflow:hidden}
.banner-kegiatan img{display:block;width:100%;height:auto;margin:0 auto;max-height:none;object-fit:contain;object-position:center center}
.halaman-bekal .banner-kegiatan{margin-bottom:14px}
.halaman-hari0 .banner-kegiatan,.halaman-hari1 .banner-kegiatan,.halaman-hari2 .banner-kegiatan{margin-bottom:0}
.halaman-tatib{
  min-height:100%;
  background:
    linear-gradient(180deg,rgba(235,231,216,.90) 0%,rgba(245,242,231,.96) 42%,rgba(245,242,231,.99) 100%),
    url("latar-pramuka-kemah.webp") center 38%/cover no-repeat;
  padding:1px 0 28px;
}
.halaman-tatib .panel{
  background:rgba(245,242,231,.72);
  border:1px solid rgba(86,76,52,.13);
  border-radius:8px;
  padding:1px 18px 24px;
  box-shadow:0 8px 24px rgba(44,38,24,.08);
}
.halaman-tatib .panel h2{color:#263522}
.halaman-tatib .panel .sub{color:#5d6556}
.halaman-tatib .bekal-visual{max-width:var(--lebar);margin:0 auto 20px;padding:0 18px}
.halaman-tatib .bekal-visual img{display:block;width:100%;height:170px;object-fit:cover;object-position:center 45%;border-radius:18px;border:1px solid rgba(86,76,52,.18);box-shadow:0 12px 28px rgba(44,38,24,.16);filter:saturate(.92)}
:root[data-theme="dark"] .halaman-tatib{
  background:
    linear-gradient(180deg,rgba(25,31,23,.86) 0%,rgba(27,34,25,.94) 42%,rgba(27,34,25,.98) 100%),
    url("latar-pramuka-kemah.webp") center 38%/cover no-repeat;
}
:root[data-theme="dark"] .halaman-tatib .panel{background:rgba(27,34,25,.78);border-color:rgba(233,228,211,.14);box-shadow:none}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .halaman-tatib{background:linear-gradient(180deg,rgba(25,31,23,.86) 0%,rgba(27,34,25,.94) 42%,rgba(27,34,25,.98) 100%),url("latar-pramuka-kemah.webp") center 38%/cover no-repeat}
  :root:not([data-theme="light"]) .halaman-tatib .panel{background:rgba(27,34,25,.78);border-color:rgba(233,228,211,.14);box-shadow:none}
}
:root[data-theme="dark"] .halaman-tatib .daftar{background:rgba(21,26,19,.86);border-color:rgba(233,228,211,.18)}
:root[data-theme="dark"] .halaman-tatib .daftar label{background:#20271D;color:#E9E4D3;border-color:rgba(233,228,211,.18)}

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .halaman-tatib .daftar{background:rgba(21,26,19,.86);border-color:rgba(233,228,211,.18)}
  :root:not([data-theme="light"]) .halaman-tatib .daftar label{background:#20271D;color:#E9E4D3;border-color:rgba(233,228,211,.18)}
  :root:not([data-theme="light"]) .halaman-tatib .daftar label:has(input:checked){background:#2b4930;border-color:#7FB183;color:#F1F4E8}
}

.eyebrow-p{font:600 .78rem/1 Karla,sans-serif;letter-spacing:.08em;color:#C9A063;margin-bottom:14px}

/* Petunjuk pelaksanaan dari dokumen teknis panitia. Ditampilkan bersama teknis
   kegiatan agar bindamping dan peserta memiliki satu acuan di setiap sesi. */
function klasifikasiGolongan(teks, fallback){
  const x = String(teks || '').toUpperCase();
  const hasil = [];
  if(/(^|[^A-Z])S([^A-Z]|$)|SIAGA|S\/G|S\/G\/T\/D/.test(x)) hasil.push('siaga');
  if(/(^|[^A-Z])G([^A-Z]|$)|PENGGALANG|G\/T|S\/G/.test(x)) hasil.push('penggalang');
  if(/(^|[^A-Z])T([^A-Z]|$)|PENEGAK|T\/D|G\/T/.test(x)) hasil.push('penegak');
  if(/(^|[^A-Z])D([^A-Z]|$)|PANDEGA|T\/D|S\/G\/T\/D/.test(x)) hasil.push('pandega');
  return hasil.length ? hasil : (fallback || ['siaga','penggalang','penegak','pandega']);
}

/* geser (swipe) di panggung */
const panggung = document.getElementById("panggung");
let geserX = null, geserY = null;
panggung.addEventListener("touchstart", e=>{
  geserX = e.touches[0].clientX; geserY = e.touches[0].clientY;
}, {passive:true});
panggung.addEventListener("touchend", e=>{
  if(geserX===null) return;
  const dx = e.changedTouches[0].clientX - geserX;
  const dy = e.changedTouches[0].clientY - geserY;
  geserX = null;
  if(Math.abs(dx) > 60 && Math.abs(dx) > Math.abs(dy)*1.3){
    if(dx < 0 && halIdx < HALAMAN.length-1) pindah(halIdx+1,"maju");
    else if(dx > 0 && halIdx > 0) pindah(halIdx-1,"mundur");
  }
}, {passive:true});

let sedangAnimasi = false;
function pindah(idxBaru, arah){
  if(sedangAnimasi || idxBaru===halIdx) return;
  const kurangGerak = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  const panggung = document.getElementById("panggung");
  const lembar = document.getElementById("lembar");

  if(kurangGerak){
    halIdx = idxBaru;
    simpanHalaman();
    render();
    return;
  }

  sedangAnimasi = true;
  const tinggiLama = lembar.offsetHeight;

  // salin tampilan lembar saat ini sebagai lapisan yang akan "dibalik"
  const overlay = document.createElement("div");
  overlay.className = "lembar-overlay";
  overlay.style.height = tinggiLama + "px";
  overlay.innerHTML = lembar.innerHTML;
  overlay.querySelectorAll("[id]").forEach(el=>el.removeAttribute("id"));
  panggung.appendChild(overlay);

  // kunci tinggi panggung sesaat, lalu tuntun ke tinggi halaman baru
  panggung.style.height = tinggiLama + "px";
  panggung.style.transition = "height .38s cubic-bezier(.22,.61,.36,1)";

  // render konten baru di lapisan dasar, sudah menunggu di balik lembaran yang berputar
  halIdx = idxBaru;
  simpanHalaman();
  render();

  requestAnimationFrame(()=>{
    const tinggiBaru = lembar.offsetHeight;
    panggung.style.height = tinggiBaru + "px";
    overlay.classList.add(arah==="maju" ? "putar-maju" : "putar-mundur");
  });

  overlay.addEventListener("transitionend", function selesai(e){
    if(e.propertyName !== "transform") return;
    overlay.removeEventListener("transitionend", selesai);
    overlay.remove();
    panggung.style.transition = "";
    panggung.style.height = "";
    sedangAnimasi = false;
  });
}


function cocok(s){

  const teks = (s.n+" "+s.t+" "+s.langkah.join(" ")+" "+s.bawa.join(" ")+" "+s.kunci).toLowerCase();
  return teks.includes(kataCari);
}

function hitungProgres(tampil, dayIdx){

  let sudah = 0;
  tampil.forEach(s=>{ if(tandai[idSesi(dayIdx, s)]) sudah++; });

function sesiCetakHTML(s, dayIdx){
  return `
    <div class="sesi" style="page-break-inside:avoid;margin-bottom:14px;border-bottom:1px solid #ccc;padding-bottom:10px">
      <div style="font-family:'Zilla Slab',serif;font-weight:700;font-size:1.05rem">${s.j} · ${s.n}${s.status && s.status!=="normal" ? ` [${LABEL_STATUS[s.status]}]` : ""} <span style="font-weight:400;font-size:.8rem">(${s.d})</span></div>
      <div style="font-size:.85rem;margin:4px 0 6px">Peserta: ${pesertaText(s.g)} — Lokasi: ${s.t}${picTeks(s) ? ` — PIC: ${picTeks(s)}` : ""}</div>
      <div style="font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#47704e;margin-top:5px">Petunjuk</div>
      <ol style="margin:4px 0;padding-left:18px;font-size:.87rem">${(s.petunjuk || []).map(l=>`<li>${l}</li>`).join("")}</ol>
      <div style="font-size:.72rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:#47704e;margin-top:5px">Uraian</div>
      ${s.langkah.map(l=>`<p>${l}</p>`).join("")}
      ${s.catatan ? `<div style="font-size:.85rem"><b>Catatan:</b> ${s.catatan}</div>` : ""}
      <div style="font-size:.85rem"><b>Dibawa:</b> ${s.bawa.join(", ")}</div>
      <div style="font-size:.85rem;margin-top:3px"><b>Perhatikan:</b> ${s.kunci}</div>
    </div>`;
}

function siapkanCetak(){
  const el = document.getElementById("cetakLengkap");
  let out = `<div class="cetak-halaman sampul-cetak"><img src="logo-perkemahan-gabungan.jpeg" alt="Logo kegiatan"><h1>Perkemahan Gabungan &amp; Pengukuhan Pengurus Kwartir Ranting</h1><p>Wawotobi · Meluhu · Anggaberi · Amonggedo<br>25–27 September 2026</p><p><b>Ikhlas Bakti Bina Bangsa<br>Berbudi Bawa Laksana</b></p></div>`;
  out += `<div class="cetak-halaman"><h2>Tema &amp; Maskot</h2>${htmlTemaMaskot()}</div>`;
  out += `<div class="cetak-halaman"><h2>Leaderboard</h2>${htmlFoto()}</div>`;
  out += `<div class="cetak-halaman"><h2>Kepanitiaan</h2>${htmlKepanitiaan()}</div>`;
  out += `<div class="cetak-halaman"><h2>Bekal &amp; Aturan</h2>${bekalHTML()}</div>`;
  jadwal.forEach((h,dayIdx)=>{
    let isi = `<div class="cetak-halaman"><h2>${h.hari === "Registrasi" ? "Kegiatan" : `${h.hari} — Kegiatan`} — ${h.tanggal}</h2>`;
    h.sesi.forEach(s=>{ isi += sesiCetakHTML(s, dayIdx); });
    isi += `</div>`;
    out += isi;
  });
  el.innerHTML = out;
}
